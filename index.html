<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Massar – Suivi de bus en temps réel en Algérie</title>
  <meta name="description" content="Massar est une application communautaire qui permet aux passagers algériens de suivre les bus en temps réel, réduire l'attente et planifier leurs trajets." />
  <meta property="og:title" content="Massar – Real-Time Bus Tracker for Algeria" />
  <meta property="og:description" content="Community-powered real-time bus tracking for Algerian commuters." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://massar-dz.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue-50: #eff6ff;
      --blue-100: #dbeafe;
      --blue-200: #bfdbfe;
      --blue-400: #60a5fa;
      --blue-500: #3b82f6;
      --blue-600: #2563eb;
      --blue-700: #1d4ed8;
      --sky-50: #f0f9ff;
      --sky-500: #0ea5e9;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --gray-900: #111827;
      --green-100: #dcfce7;
      --green-600: #16a34a;
      --green-700: #15803d;
      --amber-50: #fffbeb;
      --amber-200: #fde68a;
      --amber-700: #b45309;
      --amber-800: #92400e;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #fff;
      color: var(--gray-900);
      overflow-x: hidden;
      line-height: 1.5;
    }

    body.rtl {
      font-family: 'Cairo', system-ui, sans-serif;
      direction: rtl;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      transition: background .3s, box-shadow .3s;
      height: 64px;
    }
    nav.scrolled {
      background: rgba(255,255,255,.95);
      backdrop-filter: blur(8px);
      box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .nav-inner {
      max-width: 1152px;
      margin: 0 auto;
      padding: 0 24px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }
    .logo-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(37,99,235,.35);
      flex-shrink: 0;
    }
    .logo-icon svg { width: 20px; height: 20px; fill: white; }
    .logo-text { font-weight: 700; font-size: 1.125rem; color: var(--gray-900); }

    .nav-right { display: flex; align-items: center; gap: 12px; }

    .lang-switcher {
      display: flex;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      overflow: hidden;
      font-size: .875rem;
      font-weight: 500;
    }
    .lang-btn {
      padding: 6px 12px;
      background: white;
      color: var(--gray-600);
      border: none;
      cursor: pointer;
      transition: background .15s, color .15s;
      font-family: inherit;
      font-size: inherit;
      font-weight: inherit;
    }
    .lang-btn:hover { background: var(--blue-50); color: var(--blue-600); }
    .lang-btn.active { background: var(--blue-600); color: white; }

    .nav-site-link {
      font-size: .875rem;
      color: var(--gray-600);
      text-decoration: none;
      transition: color .2s;
    }
    .nav-site-link:hover { color: var(--blue-600); }
    @media (max-width: 640px) { .nav-site-link { display: none; } }

    .btn-primary {
      background: var(--blue-600);
      color: white;
      font-size: .875rem;
      font-weight: 500;
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
      display: inline-block;
    }
    .btn-primary:hover { background: var(--blue-700); }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding-top: 64px;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(135deg, var(--blue-50) 0%, var(--sky-50) 50%, white 100%);
    }
    .hero-blob-1 {
      position: absolute; top: 80px; right: 0;
      width: 512px; height: 512px;
      background: var(--blue-200);
      border-radius: 50%;
      opacity: .18;
      filter: blur(60px);
      z-index: -1;
    }
    .hero-blob-2 {
      position: absolute; bottom: 40px; left: 0;
      width: 256px; height: 256px;
      background: #bae6fd;
      border-radius: 50%;
      opacity: .22;
      filter: blur(50px);
      z-index: -1;
    }
    .hero-inner {
      max-width: 1152px;
      margin: 0 auto;
      padding: 80px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: center;
      width: 100%;
    }
    @media (max-width: 1024px) {
      .hero-inner { grid-template-columns: 1fr; }
      .hero-mockup { order: -1; }
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--blue-100);
      color: var(--blue-700);
      font-size: .875rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .pulse-dot {
      width: 8px; height: 8px;
      background: var(--blue-500);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }

    h1 {
      font-size: clamp(2.25rem, 5vw, 3.75rem);
      font-weight: 900;
      line-height: 1.1;
      color: var(--gray-900);
      margin-bottom: 16px;
    }
    .hero-highlight {
      display: block;
      background: linear-gradient(90deg, var(--blue-600), var(--sky-500));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-desc {
      font-size: 1.125rem;
      color: var(--gray-600);
      line-height: 1.7;
      max-width: 480px;
      margin-bottom: 32px;
    }

    .hero-download {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 20px;
      margin-bottom: 32px;
    }
    .play-badge {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: #000;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      transition: background .2s, transform .2s, box-shadow .2s;
      box-shadow: 0 4px 14px rgba(0,0,0,.25);
    }
    .play-badge:hover { background: #1a1a1a; transform: scale(1.04); box-shadow: 0 6px 20px rgba(0,0,0,.3); }
    .play-badge svg { width: 28px; height: 28px; fill: white; flex-shrink: 0; }
    .play-badge-text { line-height: 1.2; }
    .play-badge-text .above { font-size: .7rem; color: rgba(255,255,255,.75); }
    .play-badge-text .main { font-size: 1rem; font-weight: 600; }
    .play-badge-sub { font-size: .875rem; color: var(--gray-700); }
    .play-badge-sub strong { display: block; color: var(--gray-800); font-weight: 600; }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      padding-top: 16px;
      border-top: 1px solid var(--gray-100);
    }
    .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--blue-600); }
    .stat-lbl { font-size: .8125rem; color: var(--gray-500); }

    /* ─── PHONE MOCKUP ─── */
    .hero-mockup { display: flex; justify-content: center; }
    .phone-wrap {
      position: relative;
      width: 224px;
    }
    @media (min-width: 640px) { .phone-wrap { width: 256px; } }
    .phone-outer {
      background: var(--gray-900);
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 30px 60px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.08) inset;
    }
    .phone-screen {
      background: white;
      border-radius: 30px;
      overflow: hidden;
      aspect-ratio: 9/19;
      display: flex;
      flex-direction: column;
    }
    .phone-map {
      flex: 1;
      position: relative;
      background: #e8f4fd;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .map-grid {
      position: absolute; inset: 0;
      opacity: .28;
      background-image: linear-gradient(#93c5fd 1px, transparent 1px), linear-gradient(90deg, #93c5fd 1px, transparent 1px);
      background-size: 24px 24px;
    }
    .phone-map svg.route { position: absolute; inset: 0; width: 100%; height: 100%; }
    .phone-eta {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      background: white;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,.12);
      direction: ltr;
    }
    .eta-dot {
      width: 8px; height: 8px;
      background: #4ade80;
      border-radius: 50%;
      flex-shrink: 0;
      animation: pulse 1.5s infinite;
    }
    .eta-label { font-size: 8px; color: var(--gray-500); line-height: 1; }
    .eta-val { font-size: 11px; font-weight: 700; color: var(--gray-800); line-height: 1.3; }

    .phone-bar {
      background: var(--blue-700);
      padding: 10px 12px;
    }
    .phone-bar-title {
      font-size: 8px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: rgba(255,255,255,.65);
      margin-bottom: 6px;
    }
    .phone-line {
      background: rgba(255,255,255,.2);
      border-radius: 8px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px;
      direction: ltr;
    }
    .line-num {
      font-size: 10px;
      font-weight: 700;
      color: white;
      background: rgba(255,255,255,.2);
      border-radius: 4px;
      padding: 2px 5px;
    }
    .line-dest { font-size: 8px; color: rgba(255,255,255,.85); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .phone-deco-1 {
      position: absolute; top: -16px; right: -16px;
      width: 40px; height: 40px;
      background: #fbbf24;
      border-radius: 50%;
      opacity: .6;
      filter: blur(4px);
    }
    .phone-deco-2 {
      position: absolute; bottom: -16px; left: -16px;
      width: 32px; height: 32px;
      background: var(--blue-400);
      border-radius: 50%;
      opacity: .5;
      filter: blur(4px);
    }

    /* ─── SECTION BASE ─── */
    section { padding: 80px 0; }
    .container { max-width: 1152px; margin: 0 auto; padding: 0 24px; }
    .section-header { text-align: center; margin-bottom: 56px; }
    .section-header h2 { font-size: clamp(1.75rem, 3vw, 2.25rem); font-weight: 800; color: var(--gray-900); }
    .section-header p { margin-top: 12px; color: var(--gray-500); max-width: 480px; margin-left: auto; margin-right: auto; }

    /* ─── HOW IT WORKS ─── */
    .how-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
    @media (max-width: 768px) { .how-grid { grid-template-columns: 1fr; } }
    .how-card { text-align: center; }
    .how-icon-wrap { position: relative; display: inline-block; margin-bottom: 16px; }
    .how-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: var(--blue-100);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto;
    }
    .how-icon svg { width: 28px; height: 28px; stroke: var(--blue-600); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .how-step {
      position: absolute;
      top: -8px; right: -8px;
      width: 24px; height: 24px;
      background: var(--blue-600);
      color: white;
      font-size: .7rem;
      font-weight: 700;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .how-card h3 { font-size: 1.125rem; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .how-card p { font-size: .9rem; color: var(--gray-500); line-height: 1.7; }

    /* ─── FEATURES ─── */
    .features-section { background: linear-gradient(135deg, var(--blue-50), var(--sky-50)); }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    @media (max-width: 1024px) { .features-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .features-grid { grid-template-columns: 1fr; } }
    .feature-card {
      background: white;
      border: 1px solid var(--blue-100);
      border-radius: 16px;
      padding: 24px;
      transition: border-color .3s, box-shadow .3s, transform .3s;
    }
    .feature-card:hover { border-color: #93c5fd; box-shadow: 0 8px 30px rgba(37,99,235,.1); transform: translateY(-4px); }
    .feature-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--blue-100);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
      transition: background .3s;
    }
    .feature-card:hover .feature-icon { background: var(--blue-600); }
    .feature-icon svg { width: 24px; height: 24px; stroke: var(--blue-600); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s; }
    .feature-card:hover .feature-icon svg { stroke: white; }
    .feature-card h3 { font-size: 1rem; font-weight: 600; color: var(--gray-900); margin-bottom: 8px; }
    .feature-card p { font-size: .875rem; color: var(--gray-500); line-height: 1.7; }

    /* ─── CITIES ─── */
    .cities-section { text-align: center; }
    .cities-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
    .city-tag {
      padding: 8px 16px;
      background: var(--blue-50);
      color: var(--blue-700);
      font-weight: 500;
      border-radius: 9999px;
      border: 1px solid var(--blue-200);
      font-size: .875rem;
    }
    .cities-note { margin-top: 20px; font-size: .875rem; color: var(--gray-500); }

    /* ─── PRIVACY ─── */
    .privacy-section { background: var(--gray-50); }
    .privacy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    @media (max-width: 1024px) { .privacy-grid { grid-template-columns: 1fr; } }
    .privacy-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--green-100);
      color: var(--green-700);
      font-size: .875rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }
    .privacy-badge svg { width: 16px; height: 16px; flex-shrink: 0; }
    .privacy-title { font-size: clamp(1.75rem, 3vw, 2.25rem); font-weight: 800; color: var(--gray-900); margin-bottom: 16px; line-height: 1.2; }
    .privacy-title span { color: var(--blue-600); }
    .privacy-desc { color: var(--gray-600); line-height: 1.7; margin-bottom: 20px; }
    .privacy-list { list-style: none; display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
    .privacy-list li { display: flex; align-items: center; gap: 12px; font-size: .9rem; color: var(--gray-700); }
    .check-icon {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--green-100);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .check-icon svg { width: 12px; height: 12px; fill: var(--green-600); }
    .privacy-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--blue-600);
      font-size: .9rem;
      font-weight: 500;
      text-decoration: none;
      transition: color .2s;
    }
    .privacy-link:hover { color: var(--blue-700); }
    .privacy-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .privacy-card {
      background: white;
      border: 1px solid var(--gray-100);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.04);
    }
    .privacy-card .p-emoji { font-size: 2rem; margin-bottom: 8px; }
    .privacy-card h4 { font-size: .9rem; font-weight: 600; color: var(--gray-900); margin-bottom: 4px; }
    .privacy-card p { font-size: .75rem; color: var(--gray-500); }

    /* ─── DISCLAIMER ─── */
    .disclaimer-section {
      padding: 40px 0;
      background: var(--amber-50);
      border-top: 1px solid var(--amber-200);
      border-bottom: 1px solid var(--amber-200);
    }
    .disclaimer-inner { display: flex; gap: 16px; align-items: flex-start; max-width: 896px; margin: 0 auto; padding: 0 24px; }
    .disclaimer-emoji { font-size: 1.5rem; flex-shrink: 0; }
    .disclaimer-inner h3 { font-size: 1rem; font-weight: 600; color: var(--amber-800); margin-bottom: 4px; }
    .disclaimer-inner p { font-size: .875rem; color: var(--amber-700); line-height: 1.7; }

    /* ─── CTA ─── */
    .cta-section {
      padding: 96px 0;
      background: linear-gradient(90deg, var(--blue-600), var(--sky-500));
      position: relative;
      overflow: hidden;
      text-align: center;
    }
    .cta-blob-1 {
      position: absolute; top: -40px; left: 20%;
      width: 256px; height: 256px;
      background: white; border-radius: 50%;
      opacity: .08;
    }
    .cta-blob-2 {
      position: absolute; bottom: -40px; right: 20%;
      width: 192px; height: 192px;
      background: white; border-radius: 50%;
      opacity: .08;
    }
    .cta-inner { position: relative; max-width: 720px; margin: 0 auto; padding: 0 24px; }
    .cta-title { font-size: clamp(1.75rem, 3.5vw, 2.5rem); font-weight: 800; color: white; margin-bottom: 16px; }
    .cta-desc { font-size: 1.125rem; color: rgba(255,255,255,.85); margin-bottom: 40px; }
    .cta-actions { display: flex; flex-direction: column; align-items: center; gap: 16px; }
    @media (min-width: 640px) { .cta-actions { flex-direction: row; justify-content: center; } }
    .cta-trust { margin-top: 24px; font-size: .875rem; color: rgba(255,255,255,.7); }

    .play-badge-white {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: white;
      color: var(--blue-700);
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      transition: background .2s, transform .2s;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }
    .play-badge-white:hover { background: #f0f9ff; transform: scale(1.04); }
    .play-badge-white svg { width: 24px; height: 24px; fill: var(--blue-600); flex-shrink: 0; }
    .play-badge-white .text { line-height: 1.2; }
    .play-badge-white .above { font-size: .7rem; color: var(--blue-500); }
    .play-badge-white .main { font-size: 1rem; }
    .cta-ios { color: rgba(255,255,255,.7); font-size: .875rem; }

    /* ─── FOOTER ─── */
    footer { background: var(--gray-900); color: var(--gray-400); padding: 48px 0 0; }
    .footer-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; padding-bottom: 32px; border-bottom: 1px solid var(--gray-800); }
    @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr; } }
    .footer-logo { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .footer-logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .footer-logo-icon svg { width: 16px; height: 16px; fill: white; }
    .footer-logo span { color: white; font-weight: 600; }
    .footer-desc { font-size: .875rem; line-height: 1.6; }
    .footer-col h4 { color: white; font-size: .875rem; font-weight: 600; margin-bottom: 12px; }
    .footer-col a {
      display: block;
      font-size: .875rem;
      color: var(--gray-400);
      text-decoration: none;
      margin-bottom: 8px;
      transition: color .2s;
    }
    .footer-col a:hover { color: var(--blue-400); }
    .footer-bottom { padding: 20px 24px; text-align: center; font-size: .8125rem; }

    /* ─── SCROLL ARROW ─── */
    .scroll-arrow {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex; flex-direction: column;
      align-items: center;
      color: var(--gray-400);
      animation: bounce .8s infinite alternate;
    }
    .scroll-arrow svg { width: 20px; height: 20px; }
    @keyframes bounce { from { transform: translateX(-50%) translateY(0); } to { transform: translateX(-50%) translateY(6px); } }

    /* ─── RTL ADJUSTMENTS ─── */

  // ─── ENGINE ─────────────────────────────────────────────────────────────────
  let currentLang = "fr";

  function applyLang(lang) {
    currentLang = lang;
    const t = i18n[lang];
    const html = document.documentElement;

    // RTL / font
    html.setAttribute("dir", t.dir);
    html.setAttribute("lang", lang);
    document.body.classList.toggle("rtl", t.dir === "rtl");
    document.body.style.fontFamily = t.font;

    // All simple text nodes
    document.querySelectorAll("[data-i18n]").forEach(el => {
      const key = el.getAttribute("data-i18n");
      if (t[key] !== undefined) el.textContent = t[key];
    });

    // Active button
    document.querySelectorAll(".lang-btn").forEach(btn => {
      btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
    });

    // Stats
    const statsEl = document.getElementById("hero-stats");
    statsEl.innerHTML = t.stats.map(s => `
      <div>
        <div class="stat-val">${s.val}</div>
        <div class="stat-lbl">${s.lbl}</div>
      </div>
    `).join("");

    // Privacy list
    const listEl = document.getElementById("privacy-list");
    listEl.innerHTML = t.privacyPoints.map(p => `
      <li>
        <span class="check-icon">
          <svg viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
        </span>
        ${p}
      </li>
    `).join("");

    // Privacy cards
    const cardsEl = document.getElementById("privacy-cards");
    cardsEl.innerHTML = t.privacyCards.map(c => `
      <div class="privacy-card">
        <div class="p-emoji">${c.e}</div>
        <h4>${c.t}</h4>
        <p>${c.d}</p>
      </div>
    `).join("");

    // Save preference
    localStorage.setItem("massar-lang", lang);
  }

  // Language buttons
  document.querySelectorAll(".lang-btn").forEach(btn => {
    btn.addEventListener("click", () => applyLang(btn.getAttribute("data-lang")));
  });

  // Navbar scroll effect
  window.addEventListener("scroll", () => {
    document.getElementById("navbar").classList.toggle("scrolled", window.scrollY > 20);
  });

  // Init — restore saved preference
  const saved = localStorage.getItem("massar-lang");
  applyLang(saved && i18n[saved] ? saved : "fr");
</script>
